<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM · Lay Goleada</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --green: #2ECC8A; --red: #F05A5A; --amber: #F59E0B;
    --text: #e6edf3; --text2: #c9d1d9; --text3: #8b949e;
    --mono: 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 24px 20px; max-width: 960px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .header-title { font-size: 1rem; font-weight: 700; font-family: var(--mono); letter-spacing: .08em; }
  .header-sub { font-size: 0.72rem; color: var(--text3); margin-top: 2px; }
  .btn-refresh { background: var(--surface); border: 1px solid var(--border); color: var(--text2); padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-family: var(--mono); transition: border-color .15s; }
  .btn-refresh:hover { border-color: var(--green); color: var(--green); }
  .btn-refresh:disabled { opacity: .4; cursor: default; }

  .status-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .proc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .proc-card.on  { border-color: rgba(46,204,138,.35); }
  .proc-card.off { border-color: rgba(240,90,90,.35); }
  .proc-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .proc-dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .proc-dot.off { background: var(--red); }
  .proc-name { font-size: 0.85rem; font-weight: 700; }
  .proc-meta { font-size: 0.7rem; color: var(--text3); margin-top: 6px; font-family: var(--mono); }

  .section-label { font-size: 0.68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }

  .log-tabs { display: flex; gap: 6px; margin-bottom: 0; flex-wrap: wrap; }
  .log-tab { background: var(--surface); border: 1px solid var(--border); color: var(--text3); padding: 6px 14px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 0.75rem; font-family: var(--mono); border-bottom: none; }
  .log-tab.active { background: #1c2330; color: var(--text); border-color: var(--border); border-bottom: 1px solid #1c2330; }

  .log-box { background: #1c2330; border: 1px solid var(--border); border-radius: 0 8px 8px 8px; padding: 14px; font-family: var(--mono); font-size: 0.72rem; line-height: 1.6; color: var(--text2); height: 420px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .log-box .l-info  { color: var(--text2); }
  .log-box .l-warn  { color: var(--amber); }
  .log-box .l-error { color: var(--red); }
  .log-empty { color: var(--text3); font-style: italic; }

  .res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .res-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .res-label { font-size: 0.68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  .res-val { font-size: 1.5rem; font-weight: 800; font-family: var(--mono); line-height: 1; }
  .res-sub { font-size: 0.68rem; color: var(--text3); margin-top: 5px; font-family: var(--mono); }
  .res-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .res-bar-fill { height: 100%; border-radius: 2px; transition: width .4s; }
  .last-update { font-size: 0.68rem; color: var(--text3); font-family: var(--mono); margin-top: 10px; text-align: right; }

  .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .data-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .data-card-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; }
  .data-card-sub { font-size: 0.7rem; color: var(--text3); font-family: var(--mono); margin-bottom: 12px; }
  .btn-action { background: var(--surface); border: 1px solid var(--border); color: var(--text2); padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-family: var(--mono); transition: border-color .15s, color .15s; width: 100%; }
  .btn-action:hover { border-color: var(--green); color: var(--green); }
  .btn-action:disabled { opacity: .4; cursor: default; }
  .action-msg { font-size: 0.68rem; font-family: var(--mono); margin-top: 8px; min-height: 1em; }
  .action-msg.ok  { color: var(--green); }
  .action-msg.err { color: var(--red); }

  @media(max-width:500px){ .status-row { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<header>
  <div>
    <div class="header-title">LAY GOLEADA · ADM</div>
    <div class="header-sub">Cockpit de monitoramento</div>
  </div>
  <button class="btn-refresh" id="btnRefresh" onclick="load()">↻ Atualizar</button>
</header>

<div class="section-label">Processos</div>
<div class="status-row" id="procGrid">
  <div class="proc-card" style="opacity:.4">Carregando...</div>
</div>

<div class="section-label">Recursos da VM</div>
<div class="res-grid" id="resGrid">
  <div class="res-card" style="opacity:.4">Carregando...</div>
</div>

<div class="section-label">Cache da Planilha</div>
<div class="data-grid">
  <div class="data-card">
    <div class="data-card-title">LG TRINITY</div>
    <div class="data-card-sub" id="cacheInfoTrinity">Cache: 30 min</div>
    <button class="btn-action" id="btnCacheTrinity" onclick="clearCache('trinity')">⟳ Forçar atualização</button>
    <div class="action-msg" id="cacheMsgTrinity"></div>
  </div>
  <div class="data-card">
    <div class="data-card-title">LG FREE FIRE</div>
    <div class="data-card-sub" id="cacheInfoFreefire">Cache: 30 min</div>
    <button class="btn-action" id="btnCacheFreefire" onclick="clearCache('freefire')">⟳ Forçar atualização</button>
    <div class="action-msg" id="cacheMsgFreefire"></div>
  </div>
</div>

<div class="section-label">Logs</div>
<div class="log-tabs" id="logTabs"></div>
<div class="log-box" id="logBox"><span class="log-empty">Selecione um processo acima.</span></div>
<div class="last-update" id="lastUpdate"></div>

<script>
const API = 'https://api.laygoleada.com.br/adm/api/status';
let currentLog = null, logsData = {};

const LABELS = {
  api_freefire:    'API FreeFire',
  api_parceiros:   'API Parceiros',
  bot_trinity:     'Bot Trinity',
  bot_freefire:    'Bot FreeFire',
};

function colorLog(text) {
  if (!text) return '<span class="log-empty">Log vazio.</span>';
  return text.split('\n').map(line => {
    if (/\[ERROR\]/.test(line)) return `<span class="l-error">${esc(line)}</span>`;
    if (/\[WARNING\]/.test(line)) return `<span class="l-warn">${esc(line)}</span>`;
    return `<span class="l-info">${esc(line)}</span>`;
  }).join('\n');
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showLog(key) {
  currentLog = key;
  document.querySelectorAll('.log-tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  const box = document.getElementById('logBox');
  box.innerHTML = colorLog(logsData[key] || '');
  box.scrollTop = box.scrollHeight;
}

async function load() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.textContent = '↻ Buscando...';
  try {
    const resp = await fetch(API);
    const d = await resp.json();

    // Processos
    const grid = document.getElementById('procGrid');
    grid.innerHTML = d.processes.map(p => `
      <div class="proc-card ${p.running ? 'on' : 'off'}">
        <div><span class="proc-dot ${p.running ? 'on' : 'off'}"></span><span class="proc-name">${p.name}</span></div>
        <div class="proc-meta">
          ${p.running ? `● RODANDO${p.pid ? ' · PID ' + p.pid : ''}` : '○ PARADO'}
          ${p.port ? `<br>Porta ${p.port}` : ''}
        </div>
      </div>`).join('');

    // Logs
    logsData = d.logs;
    const tabs = document.getElementById('logTabs');
    if (!tabs.children.length) {
      tabs.innerHTML = Object.keys(d.logs).map(k =>
        `<div class="log-tab" data-key="${k}" onclick="showLog('${k}')">${LABELS[k] || k}</div>`
      ).join('');
      currentLog = Object.keys(d.logs)[0];
    }
    showLog(currentLog || Object.keys(d.logs)[0]);

    // Recursos
    const r = d.resources;
    const fmt = b => b >= 1e9 ? (b/1e9).toFixed(1)+' GB' : (b/1e6).toFixed(0)+' MB';
    const barColor = p => p < 60 ? 'var(--green)' : p < 85 ? 'var(--amber)' : 'var(--red)';
    const resItems = [
      { label: 'CPU', val: r.cpu+'%', sub: 'Uso atual', pct: r.cpu },
      { label: 'RAM', val: r.ram.pct+'%', sub: `${fmt(r.ram.used)} de ${fmt(r.ram.total)}`, pct: r.ram.pct },
      { label: 'Disco', val: r.disk.pct+'%', sub: `${fmt(r.disk.used)} de ${fmt(r.disk.total)}`, pct: r.disk.pct },
    ];
    document.getElementById('resGrid').innerHTML = resItems.map(i => `
      <div class="res-card">
        <div class="res-label">${i.label}</div>
        <div class="res-val" style="color:${barColor(i.pct)}">${i.val}</div>
        <div class="res-sub">${i.sub}</div>
        <div class="res-bar"><div class="res-bar-fill" style="width:${i.pct}%;background:${barColor(i.pct)}"></div></div>
      </div>`).join('');

    const now = new Date().toLocaleTimeString('pt-BR');
    document.getElementById('lastUpdate').textContent = `Atualizado às ${now}`;
  } catch(e) {
    document.getElementById('procGrid').innerHTML = `<div class="proc-card off"><div class="proc-name">Erro ao conectar</div><div class="proc-meta">${e.message}</div></div>`;
  }
  btn.disabled = false;
  btn.textContent = '↻ Atualizar';
}

const CACHE_ENDPOINTS = {
  freefire:    'https://api.laygoleada.com.br/api/cache/clear',
  trinity:     'https://api.laygoleada.com.br/trinity/api/cache/clear',
  overtriplex: 'https://api.laygoleada.com.br/overtriplex/api/cache/clear',
};

async function clearCache(product) {
  const btn = document.getElementById(`btnCache${product.charAt(0).toUpperCase()+product.slice(1)}`);
  const msg = document.getElementById(`cacheMsg${product.charAt(0).toUpperCase()+product.slice(1)}`);
  const info = document.getElementById(`cacheInfo${product.charAt(0).toUpperCase()+product.slice(1)}`);
  btn.disabled = true;
  btn.textContent = '⟳ Limpando...';
  msg.className = 'action-msg';
  msg.textContent = '';
  try {
    await fetch(CACHE_ENDPOINTS[product], { method: 'POST' });
    msg.className = 'action-msg ok';
    msg.textContent = '✓ Cache limpo — próxima visita já busca a planilha.';
    info.textContent = `Limpo às ${new Date().toLocaleTimeString('pt-BR')}`;
  } catch(e) {
    msg.className = 'action-msg err';
    msg.textContent = '✗ Erro: ' + e.message;
  }
  btn.disabled = false;
  btn.textContent = '⟳ Forçar atualização';
}

load();
</script>
</body>
</html>
