<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lay Goleada · Treinamento Packball</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{
  --bg:#0D1117;--bg2:#161B22;--bg3:#1C2330;
  --border:rgba(255,255,255,.08);
  --text:#E8ECF0;--text2:#8A96A3;--text3:#556070;
  --green:#2ECC8A;--red:#F05A5A;
  --accent:#2979FF;--accent-dim:rgba(41,121,255,.12);--accent-border:rgba(41,121,255,.3);
  --accent-light:#82B1FF;
  --r1:8px;--r2:12px;--r3:16px;
  --mono:'JetBrains Mono','Fira Mono','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:20px;}
.loader-logo{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.15em;color:var(--accent);}
.loader-bar{width:200px;height:3px;background:var(--bg3);border-radius:99px;overflow:hidden;}
.loader-fill{height:100%;background:var(--accent);border-radius:99px;animation:lf 1.6s ease-in-out infinite;}
@keyframes lf{0%{width:0%;margin-left:0%;}50%{width:60%;margin-left:20%;}100%{width:0%;margin-left:100%;}}
#loadingText{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.08em;}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.logo-wrap{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex-shrink:0;}
.logo-info{display:flex;flex-direction:column;gap:1px;}
.logo-brand{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);letter-spacing:.04em;line-height:1;}
.logo-sub{font-family:var(--mono);font-size:9px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;}
.header-cta{display:flex;gap:10px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--r1);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;border:none;transition:opacity .15s;}
.btn-packball{background:var(--accent);color:#fff;font-weight:700;}
.btn-packball:hover{opacity:.85;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-outline:hover{color:var(--text);border-color:rgba(255,255,255,.2);}

/* HERO */
.hero{border-bottom:1px solid var(--border);}
.hero-banner{width:100%;display:block;}
.hero-actions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:20px 24px;}
.btn-hero{padding:12px 28px;font-size:14px;border-radius:var(--r2);}

/* CONTAINER */
.container{max-width:1100px;margin:0 auto;padding:36px 20px 80px;}

/* SECTION LABEL */
.section-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:0 0 20px;border-left:3px solid var(--accent);padding-left:10px;}

/* GRID DE VÍDEOS */
.videos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}

/* CARD DE VÍDEO */
.video-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:border-color .15s,transform .15s;}
.video-card:hover{border-color:var(--accent-border);transform:translateY(-2px);}
.video-thumb{position:relative;width:100%;padding-top:56.25%;overflow:hidden;background:var(--bg3);}
.video-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.video-thumb-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:32px;}
.video-num{position:absolute;bottom:0;right:0;background:var(--accent);color:#fff;font-family:var(--mono);font-size:11px;font-weight:900;padding:5px 11px;border-top-left-radius:8px;letter-spacing:.12em;}
.video-aula-label{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;border-left:3px solid var(--accent);padding-left:8px;}
.video-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;background:rgba(0,0,0,.4);transition:opacity .15s;}
.video-card:hover .video-play{opacity:1;}
.play-icon{width:44px;height:44px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.play-icon svg{margin-left:3px;}
.video-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:6px;}
.video-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.video-meta{font-size:11px;color:var(--text3);font-family:var(--mono);}

/* ESTADO VAZIO */
.state-box{text-align:center;padding:60px 20px;color:var(--text3);}
.state-box .icon{font-size:40px;margin-bottom:16px;}
.state-box p{font-size:14px;}

/* CTA BOTTOM */
.cta-bottom{margin-top:48px;background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:var(--r3);padding:36px 24px;text-align:center;}
.cta-bottom-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;}
.cta-bottom-desc{font-size:14px;color:var(--text2);margin-bottom:20px;}

/* RESPONSIVE */
@media(max-width:600px){
  .videos-grid{grid-template-columns:1fr;}
  .header{padding:10px 16px;}
  .container{padding:24px 14px 60px;}
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="loader-logo">PACKBALL</div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <div id="loadingText">carregando aulas...</div>
</div>

<!-- HEADER -->
<header class="header">
  <a class="logo-wrap" href="/">
    <img class="logo-img" src="/favicon.png" alt="Lay Goleada" onerror="this.style.display='none'">
    <div class="logo-info">
      <span class="logo-brand">LAY GOLEADA</span>
      <span class="logo-sub">Treinamento Packball</span>
    </div>
  </a>
  <div class="header-cta">
    <a class="btn btn-outline" href="https://instagram.com/laygoleada" target="_blank">Instagram</a>
    <a class="btn btn-packball" href="https://packball.com/matches?affiliate=201704257371" target="_blank">Acessar Packball →</a>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <img class="hero-banner" src="/img/bannerPackball.jpg" alt="Treinamento Exclusivo Packball">
  <div class="hero-actions">
    <a class="btn btn-packball btn-hero" href="https://packball.com/matches?affiliate=201704257371" target="_blank">Acessar Packball →</a>
    <a class="btn btn-outline btn-hero" href="https://instagram.com/laygoleada" target="_blank">Seguir no Instagram</a>
  </div>
</section>

<!-- CONTEÚDO -->
<div class="container">
  <div class="section-label">Aulas do treinamento</div>
  <div class="videos-grid" id="videosGrid"></div>

  <div id="stateBox" class="state-box" style="display:none;">
    <div class="icon">📭</div>
    <p id="stateMsg">Nenhuma aula encontrada.</p>
  </div>

  <div class="cta-bottom">
    <div class="cta-bottom-title">Pronto para dominar a análise de jogos?</div>
    <div class="cta-bottom-desc">Acesse o Packball e use tudo que aprendeu nas aulas.</div>
    <a class="btn btn-packball btn-hero" href="https://packball.com/matches?affiliate=201704257371" target="_blank">Acessar Packball →</a>
  </div>
</div>

<script>
const PLAYLIST_ID = 'PLoDxogcCy7R2iMEB0XjTJkeaCRNHmzBX1';
const API_KEY     = 'AIzaSyCZLE_QjjRyVf_vONOda7V4EWgYzrxd9bg';
const MAX_RESULTS = 50;

async function fetchPlaylist(pageToken = '') {
  const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=${MAX_RESULTS}&playlistId=${PLAYLIST_ID}&key=${API_KEY}${pageToken ? '&pageToken=' + pageToken : ''}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`API error ${r.status}`);
  return r.json();
}

function buildCard(item, index) {
  const s     = item.snippet;
  const vid   = s.resourceId.videoId;
  const url   = `https://www.youtube.com/watch?v=${vid}`;
  const thumb = s.thumbnails?.high?.url || s.thumbnails?.medium?.url || s.thumbnails?.default?.url || '';
  const num   = (s.position !== undefined ? s.position + 1 : index + 1);
  const title = s.title || 'Sem título';

  return `
    <a class="video-card" href="${url}" target="_blank" rel="noopener">
      <div class="video-thumb">
        ${thumb
          ? `<img src="${thumb}" alt="${title.replace(/"/g,'')}" loading="lazy">`
          : `<div class="video-thumb-placeholder">🎬</div>`}
        <div class="video-num">AULA ${String(num).padStart(2,'0')}</div>
        <div class="video-play">
          <div class="play-icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="white"><polygon points="4,2 14,8 4,14"/></svg>
          </div>
        </div>
      </div>
      <div class="video-body">
        <div class="video-aula-label">AULA ${String(num).padStart(2,'0')}</div>
        <div class="video-title">${title}</div>
        <div class="video-meta">YouTube · Treinamento Packball</div>
      </div>
    </a>`;
}

async function init() {
  const grid     = document.getElementById('videosGrid');
  const state    = document.getElementById('stateBox');
  const stateMsg = document.getElementById('stateMsg');

  try {
    let allItems = [];
    let pageToken = '';
    do {
      const data = await fetchPlaylist(pageToken);
      allItems = allItems.concat(data.items || []);
      pageToken = data.nextPageToken || '';
    } while (pageToken);

    if (!allItems.length) {
      state.style.display = 'block';
      stateMsg.textContent = 'Nenhuma aula encontrada na playlist.';
      return;
    }

    grid.innerHTML = allItems.map((item, i) => buildCard(item, i)).join('');
  } catch (e) {
    state.style.display = 'block';
    stateMsg.textContent = 'Erro ao carregar as aulas. Tente novamente mais tarde.';
    console.error(e);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

init();
</script>
</body>
</html>
